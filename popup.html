<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>字幕樣式</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon-32.png" alt="" width="28" height="28">
    <div class="title">
      <h1>字幕樣式</h1>
      <p>調整後影片上的字幕即時變化</p>
    </div>
    <a class="pill" id="guide" href="docs/index.html" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h6a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h7z"/></svg>
      使用教學
    </a>
    <button type="button" class="icon-btn" id="reset" aria-label="重設為預設值" title="重設為預設值">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
    </button>
  </header>

  <div id="preview" role="img" aria-label="字幕預覽">
    <div class="player-bar" aria-hidden="true"><span class="play"></span><span class="track"><i></i></span></div>
    <div id="sample"></div>
  </div>

  <section class="card" aria-label="文字">
    <div class="field">
      <span class="label" id="l-color">顏色</span>
      <div class="ctl swatches" id="color" role="group" aria-labelledby="l-color"></div>
    </div>
    <div class="field">
      <span class="label" id="l-textAlpha">透明度</span>
      <div class="ctl seg" id="textAlpha" role="group" aria-labelledby="l-textAlpha"></div>
    </div>
    <div class="field">
      <span class="label" id="l-size">大小</span>
      <div class="ctl seg" id="size" role="group" aria-labelledby="l-size"></div>
    </div>
    <div class="field">
      <span class="label" id="l-font">字形</span>
      <div class="ctl seg" id="font" role="group" aria-labelledby="l-font"></div>
    </div>
    <div class="field">
      <span class="label" id="l-edge">邊緣</span>
      <div class="ctl tiles" id="edge" role="group" aria-labelledby="l-edge"></div>
    </div>
  </section>

  <section class="card" aria-label="背景與位置">
    <div class="field">
      <span class="label" id="l-bg">背景色</span>
      <div class="ctl swatches" id="bg" role="group" aria-labelledby="l-bg"></div>
    </div>
    <div class="field">
      <span class="label" id="l-bgAlpha">背景透明</span>
      <div class="ctl seg" id="bgAlpha" role="group" aria-labelledby="l-bgAlpha"></div>
    </div>
    <div class="field">
      <label class="label" for="bottom">離底部</label>
      <div class="ctl slider">
        <input type="range" id="bottom" min="0" max="300" step="5">
        <output id="bottomValue" for="bottom"></output>
      </div>
    </div>
  </section>

  <script src="lib.js"></script>
  <script src="popup.js"></script>
</body>
</html>
